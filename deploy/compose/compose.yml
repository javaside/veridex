name: veridex
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veridex}
      POSTGRES_USER: ${POSTGRES_USER:-veridex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridex-local}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-veridex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-veridex-local}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veridex}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veridex-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.13.2
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.3
    ports: ["3200:3200"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:13.1.3
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-veridex-local}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      # 降低 JVM 堆：本机 Docker VM 内存紧张，默认 1g 堆 + 全量索引 mmap 会触发容器 OOM kill。
      # 减少堆可显著降低 OOM 概率；同时建议按需清理历史索引（见 Phase 3 排障记录）。
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    image: veridex-backend:0.1.0
    environment:
      VERIDEX_ENVIRONMENT: local
      # reindex profile 透传：restore.sh 用 compose run -e SPRING_PROFILES_ACTIVE=reindex
      # 覆盖为一次性重建容器，常驻启动保持空（不装配 ReindexRunner）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      VERIDEX_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-veridex}
      VERIDEX_DB_USERNAME: ${POSTGRES_USER:-veridex}
      VERIDEX_DB_PASSWORD: ${POSTGRES_PASSWORD:-veridex-local}
      VERIDEX_RABBITMQ_HOST: rabbitmq
      VERIDEX_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-veridex}
      VERIDEX_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-veridex-local}
      VERIDEX_MINIO_ENDPOINT: http://minio:9000
      VERIDEX_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-veridex}
      VERIDEX_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-veridex-local-secret}
      VERIDEX_MINIO_BUCKET: veridex-documents
      VERIDEX_OPENSEARCH_URIS: http://opensearch:9200
      VERIDEX_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # 容器内必须监听全部接口，否则同网 Prometheus 抓不到管理端口
      VERIDEX_MANAGEMENT_ADDRESS: 0.0.0.0
      VERIDEX_CORS_ALLOWED_ORIGINS: http://localhost:8090
      # --- Ollama Chat（可选，默认 deterministic 无需配置）---
      # 指向宿主机 Ollama 时用 host.docker.internal，不要用 localhost（容器内）。
      # VERIDEX_CHAT_PROVIDER: ollama
      # VERIDEX_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # VERIDEX_OLLAMA_CHAT_MODEL: qwen3:8b
      # VERIDEX_CHAT_TIMEOUT: 60s
      # VERIDEX_OUTBOUND_ALLOWED_HOSTS: host.docker.internal
      # VERIDEX_OUTBOUND_ALLOWED_PORTS: "11434"
      # VERIDEX_OUTBOUND_ALLOW_INSECURE_HTTP: "true"
      # 提示：compose 栈未打包 Ollama 服务，需自行提供（设计 §8.1）。
    read_only: true
    tmpfs:
      # /tmp 本身也要可写：只读根文件系统下 Tomcat 需在 java.io.tmpdir 创建工作目录
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
      - /tmp/veridex-parser:size=2g,uid=10001,gid=10001
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      otel-collector: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    image: veridex-web:0.1.0
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
      VERIDEX_BACKEND_UPSTREAM: backend:8080
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101
    ports:
      - "127.0.0.1:${VERIDEX_WEB_PORT:-8090}:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  opensearch-data:
  prometheus-data:
  tempo-data:
  grafana-data:
