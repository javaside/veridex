global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: veridex
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8081]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
