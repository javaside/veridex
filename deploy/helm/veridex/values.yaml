global:
  imageRegistry: ""
  imagePullSecrets: []

backend:
  replicaCount: 2
  image:
    repository: veridex/backend
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret: veridex-secret
  podAnnotations: {}
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  parserTemp:
    sizeLimit: 2Gi
  terminationGracePeriodSeconds: 45
  startupProbe: { periodSeconds: 5, failureThreshold: 40 }
  readinessProbe: { periodSeconds: 10, failureThreshold: 3 }
  livenessProbe: { periodSeconds: 10, failureThreshold: 6 }
  env:
    VERIDEX_ENVIRONMENT: pilot
    VERIDEX_DB_URL: jdbc:postgresql://postgres:5432/veridex
    VERIDEX_RABBITMQ_HOST: rabbitmq
    VERIDEX_MINIO_ENDPOINT: http://minio:9000
    VERIDEX_MINIO_BUCKET: veridex-documents
    VERIDEX_OPENSEARCH_URIS: http://opensearch:9200
    VERIDEX_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    VERIDEX_MANAGEMENT_ADDRESS: 0.0.0.0
    # ⚠️ 模型配置（必读）：真实问答/检索必须配好 chat 与 embedding，不要用 deterministic——
    # 它是 128 维无语义哈希 / 模板占位，跑不出真实结果，只用于无外部依赖的离线冒烟。
    # 生产/真实使用请覆盖为 deepseek（chat，需 VERIDEX_DEEPSEEK_API_KEY）或 ollama（chat），
    # 以及 ollama（embedding，1024 维）。
    #
    # Chat provider（deterministic 为测试占位；ollama 需外部预置 Ollama 并显式放行 egress）
    VERIDEX_CHAT_PROVIDER: deterministic
    VERIDEX_DEEPSEEK_API_KEY: ""
    VERIDEX_CHAT_TIMEOUT: 60s
    VERIDEX_OLLAMA_BASE_URL: http://ollama.internal:11434
    VERIDEX_OLLAMA_CHAT_MODEL: qwen3:8b
    # Embedding 向量模型（默认 deterministic 无语义，必须切 ollama + 1024 维才有真实向量）
    VERIDEX_EMBEDDING_PROVIDER: deterministic
    VERIDEX_EMBEDDING_DIMENSIONS: "128"
    VERIDEX_OLLAMA_EMBEDDING_MODEL: qwen3-embedding:0.6b

web:
  replicaCount: 2
  image:
    repository: veridex/web
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  podAnnotations: {}
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

webSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

serviceAccount: { create: true, name: "" }

ingress:
  enabled: false
  className: nginx
  hostname: veridex.example.local
  annotations: {}
  tls: { enabled: false, secretName: veridex-tls }

podDisruptionBudget: { enabled: true, minAvailable: 1 }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

networkPolicy:
  enabled: true
  ingressNamespaceSelector: { kubernetes.io/metadata.name: ingress-nginx }
  monitoringSelector: { app.kubernetes.io/name: prometheus }
  # externalEgress：显式放行外部依赖（Postgres/RabbitMQ/MinIO/OpenSearch/OTLP/Ollama），为空则默认拒绝。
  # 每项二选一形态（type 必须是 selector 或 cidr）：
  # - { type: selector, namespace: <ns>, podSelector: {...}, port: 5432 }
  # - { type: cidr, cidr: 10.0.0.0/16, port: 5432 }
  # Ollama 示例（VERIDEX_CHAT_PROVIDER=ollama 时）：
  # - { type: selector, namespace: ollama, podSelector: { app.kubernetes.io/name: ollama }, port: 11434 }
  externalEgress: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
