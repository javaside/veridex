apiVersion: v1
kind: Service
metadata:
  name: {{ include "veridex.fullname" . }}-backend
  labels:
    {{- include "veridex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "veridex.backendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
