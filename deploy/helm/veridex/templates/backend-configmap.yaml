apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "veridex.fullname" . }}-backend-config
  labels:
    {{- include "veridex.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
{{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
