server:
  # 不用默认 8080：本机多个系统/容器默认占用它（此前 sub2api 抢 IPv4:8080 导致登录失败）。
  # 本地开发用 8088，可用 VERIDEX_PORT 覆盖；compose 内部仍走 backend:8080（见 compose.yml），不受影响。
  port: ${VERIDEX_PORT:8088}
  servlet:
    session:
      cookie:
        # Spring Session 的 DefaultCookieSerializer 未显式命名时默认 SESSION；
        # 保持既有 JSESSIONID 线上契约（浏览器已登录 cookie、文档、回归测试）不变。
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${VERIDEX_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: veridex
  datasource:
    url: ${VERIDEX_DB_URL:jdbc:postgresql://localhost:5432/veridex}
    username: ${VERIDEX_DB_USERNAME:veridex}
    password: ${VERIDEX_DB_PASSWORD:veridex-local}
  flyway:
    enabled: true
    validate-on-migrate: true
  rabbitmq:
    host: ${VERIDEX_RABBITMQ_HOST:localhost}
    port: ${VERIDEX_RABBITMQ_PORT:5672}
    username: ${VERIDEX_RABBITMQ_USERNAME:veridex}
    password: ${VERIDEX_RABBITMQ_PASSWORD:veridex-local}
    template:
      observation-enabled: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        observation-enabled: true
      direct:
        observation-enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mvc:
    async:
      request-timeout: ${VERIDEX_SSE_ASYNC_TIMEOUT:120s}
  session:
    # Spring Boot 4 移除了 store-type：由 classpath 上的 spring-boot-starter-session-jdbc 激活 JDBC 存储
    timeout: ${VERIDEX_SESSION_TIMEOUT:8h}
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
    vectorstore:
      observations:
        # Spring AI 2.0.0 GA has not yet shipped the vector store observations module
        # (spring-ai-autoconfigure-vector-store-observation exists only as 1.x / 2.0.0-SNAPSHOT),
        # so this key currently has no binding. It is kept so that when the module lands in a
        # future upgrade the default can be verified here; without this note the key would read
        # as dead-but-intentional configuration.
        log-query-response: false

veridex:
  security:
    environment: ${VERIDEX_ENVIRONMENT:local}
    cors-allowed-origins: ${VERIDEX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    session-cookie-secure: ${VERIDEX_SESSION_COOKIE_SECURE:false}
    upload:
      max-file-bytes: ${VERIDEX_UPLOAD_MAX_FILE_BYTES:52428800}
      max-archive-expanded-bytes: ${VERIDEX_UPLOAD_MAX_ARCHIVE_EXPANDED_BYTES:209715200}
      max-archive-entries: ${VERIDEX_UPLOAD_MAX_ARCHIVE_ENTRIES:10000}
      max-archive-depth: ${VERIDEX_UPLOAD_MAX_ARCHIVE_DEPTH:8}
    parser:
      timeout: ${VERIDEX_PARSER_TIMEOUT:30s}
      temp-root: ${VERIDEX_PARSER_TEMP_ROOT:/tmp/veridex-parser}
    outbound:
      allowed-hosts: ${VERIDEX_OUTBOUND_ALLOWED_HOSTS:}
      allowed-ports: ${VERIDEX_OUTBOUND_ALLOWED_PORTS:}
      allow-insecure-http: ${VERIDEX_OUTBOUND_ALLOW_INSECURE_HTTP:false}
  api:
    rate-limit-per-minute: ${VERIDEX_RATE_LIMIT_PER_MINUTE:600}
  storage:
    minio:
      endpoint: ${VERIDEX_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${VERIDEX_MINIO_ACCESS_KEY:veridex}
      secret-key: ${VERIDEX_MINIO_SECRET_KEY:veridex-local-secret}
      bucket: ${VERIDEX_MINIO_BUCKET:veridex-documents}
  search:
    opensearch:
      uris: ${VERIDEX_OPENSEARCH_URIS:http://localhost:9200}
      index-prefix: ${VERIDEX_OPENSEARCH_INDEX_PREFIX:veridex}
  embedding:
    provider: ${VERIDEX_EMBEDDING_PROVIDER:deterministic}
    dimensions: ${VERIDEX_EMBEDDING_DIMENSIONS:128}
    ollama:
      base-url: ${VERIDEX_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${VERIDEX_OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
  chat:
    provider: ${VERIDEX_CHAT_PROVIDER:deepseek}
    timeout: ${VERIDEX_CHAT_TIMEOUT:60s}
    ollama:
      base-url: ${VERIDEX_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${VERIDEX_OLLAMA_CHAT_MODEL:qwen3.5:9b}
    deepseek:
      base-url: ${VERIDEX_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${VERIDEX_DEEPSEEK_API_KEY:${DEEPSEEK_API_KEY:}}
      model: ${VERIDEX_DEEPSEEK_MODEL:deepseek-v4-flash}
  observability:
    environment: ${VERIDEX_ENVIRONMENT:local}
  trace:
    body:
      capture-policy: ${VERIDEX_TRACE_BODY_CAPTURE_POLICY:NONE}
      retention: ${VERIDEX_TRACE_BODY_RETENTION:24h}
      max-plaintext-size: ${VERIDEX_TRACE_BODY_MAX_PLAINTEXT_SIZE:256KB}
      cleanup-interval: ${VERIDEX_TRACE_BODY_CLEANUP_INTERVAL:1h}
      cleanup-batch-size: ${VERIDEX_TRACE_BODY_CLEANUP_BATCH_SIZE:500}
      fingerprint-key: ${VERIDEX_TRACE_BODY_FINGERPRINT_KEY:}
      current-key-id: ${VERIDEX_TRACE_BODY_CURRENT_KEY_ID:}
      current-key: ${VERIDEX_TRACE_BODY_CURRENT_KEY:}
      historical-keys: ${VERIDEX_TRACE_BODY_HISTORICAL_KEYS:}

springdoc:
  paths-to-match: /api/**
  default-support-form-authentication: false

management:
  server:
    port: ${VERIDEX_MANAGEMENT_PORT:8081}
    address: ${VERIDEX_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${VERIDEX_TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${VERIDEX_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${VERIDEX_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        veridex.qa.run: true
        veridex.generation.model: true
